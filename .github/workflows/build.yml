name: Build APK

# Каждый push в main: сборка → подпись постоянным ключом → GitHub Release с APK.
# Obtainium на телефоне следит за релизами и сам ставит обновление.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Ключ подписи из секрета
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Нет секрета SIGNING_KEYSTORE_BASE64 — без него обновления на телефоне не встанут"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/minilauncher.p12"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/minilauncher.p12" >> "$GITHUB_ENV"

      - name: Build debug and release APK
        # Без кэшей: релиз всегда собирается заново и подписывается постоянным ключом.
        run: gradle --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks assembleDebug assembleRelease

      - name: Проверить подпись (иначе телефон не примет обновление)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signers.txt
          if ! grep -qi "61cdd8e68965f598c7a007b86526bb66f48095146239c7821b453b7c504450aa" signers.txt; then
            echo "::error::APK подписан не постоянным ключом — релиз не публикуем"
            exit 1
          fi

      - name: Подготовить APK к релизу
        run: cp app/build/outputs/apk/release/app-release.apk "MiniLauncher-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MiniLauncher-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MiniLauncher 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: MiniLauncher-1.0.${{ github.run_number }}.apk
          make_latest: "true"
